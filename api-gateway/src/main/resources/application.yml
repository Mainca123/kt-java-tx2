server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**
              filters:
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**
              filters:
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: INTERNAL_SERVER_ERROR,BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    version: ${APP_VERSION:1.0.0}
