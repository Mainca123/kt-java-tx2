syntax = "proto3";
package com.ecommerce.grpc;
option java_multiple_files = true;
option java_package = "com.ecommerce.grpc";
option java_outer_classname = "ProductProto";

// This generates ProductServiceGrpc (the service itself must not end in Grpc).
service ProductService {
  rpc GetProductById (ProductRequest) returns (ProductResponse);
}
message ProductRequest { int64 id = 1; }
message ProductResponse {
  int64 id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
  // Decimal text is authoritative for money; double is kept for the assignment contract.
  string price_decimal = 5;
}
