name: tx2-ecommerce
services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_dev}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - kafka-data:/data
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xmx256m -Xms128m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  product-service:
    image: tx2/product-service:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        SERVICE: product-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql-db:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ecommerce
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9090:9090"
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
  order-service:
    image: tx2/order-service:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql-db:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ecommerce
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      PRODUCT_GRPC_ADDRESS: static://product-service:9090
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      product-service:
        condition: service_healthy
    restart: unless-stopped
  api-gateway:
    image: tx2/api-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        SERVICE: api-gateway
    environment:
      SERVER_PORT: 8080
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18080}:8080"
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
  kafka-data:
