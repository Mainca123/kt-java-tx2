apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: tx2-ecommerce
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: tx2/order-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SERVER_PORT
          value: '8082'
        - name: APP_VERSION
          value: local
        - name: DB_URL
          value: jdbc:mysql://mysql-db:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: password
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
          value: readinessState,db
        - name: PRODUCT_GRPC_ADDRESS
          value: static://product-service:9090
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          periodSeconds: 10
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          periodSeconds: 5
          failureThreshold: 60
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: tx2-ecommerce
spec:
  selector:
    app: order-service
  ports:
  - name: http
    port: 8082
    targetPort: 8082
