apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: tx2-ecommerce
type: Opaque
stringData:
  username: ecommerce
  password: ecommerce_dev
  root-password: root_dev_only
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: tx2-ecommerce
data:
  init.sql: 'CREATE DATABASE IF NOT EXISTS product_db CHARACTER SET utf8mb4 COLLATE
    utf8mb4_unicode_ci;

    CREATE DATABASE IF NOT EXISTS order_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    GRANT ALL PRIVILEGES ON product_db.* TO ''ecommerce''@''%'';

    GRANT ALL PRIVILEGES ON order_db.* TO ''ecommerce''@''%'';

    FLUSH PRIVILEGES;

    '
